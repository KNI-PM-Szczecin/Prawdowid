[project]
name = "prawdowid-eval"
version = "0.1.0"
description = "Prawdowid evaluation harness: brief scenarios A-J, metrics and report"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.4",
]

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
