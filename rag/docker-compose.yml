services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    profiles: ["local-db"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rag
      # Only the local-db profile uses it; the postgres image refuses to start with an empty password.
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-}
      POSTGRES_DB: rag
    # Localhost only, so backend/ run with go run can use the same offline database.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 2s
      retries: 30

  rag:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      RAG_POSTGRES_DSN: ${DATABASE_URL:-postgresql://rag:${RAG_POSTGRES_PASSWORD:-}@postgres:5432/rag}
      RAG_POSTGRES_POOL_MAX_SIZE: ${RAG_POSTGRES_POOL_MAX_SIZE:-5}
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_MODEL_CACHE_DIR: /models
      RAG_ADMIN_TOKEN: ${RAG_ADMIN_TOKEN:-}
      RAG_EXPANSION_LLM_URL: ${RAG_EXPANSION_LLM_URL:-}
      RAG_EXPANSION_LLM_MODEL: ${RAG_EXPANSION_LLM_MODEL:-qwen3.5:9b}
      RAG_EXPANSION_LLM_API_KEY: ${RAG_EXPANSION_LLM_API_KEY:-}
      FACTCHECK_API_KEY: ${FACTCHECK_API_KEY:-}
    volumes:
      - model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_started

volumes:
  qdrant_data:
  postgres_data:
  model_cache:
