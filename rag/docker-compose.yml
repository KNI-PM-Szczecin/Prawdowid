services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 2s
      retries: 30

  rag:
    build: .
    ports:
      - "8001:8000"
    environment:
      RAG_POSTGRES_DSN: postgresql://rag:rag@postgres:5432/rag
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_MODEL_CACHE_DIR: /models
      RAG_EXPANSION_LLM_URL: ${RAG_EXPANSION_LLM_URL:-}
      RAG_EXPANSION_LLM_MODEL: ${RAG_EXPANSION_LLM_MODEL:-qwen3.5:9b}
    volumes:
      - model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  qdrant_data:
  postgres_data:
  model_cache:
