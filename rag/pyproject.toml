[project]
name = "prawdowid-rag"
version = "0.1.0"
description = "Prawdowid evidence retrieval service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "fastembed==0.9.1",
    "asyncpg==0.32.0",
    "apscheduler==3.11.3",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "pytesseract==0.3.13",
    "pillow==13.0.0",
    "python-multipart==0.0.34",
]

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
