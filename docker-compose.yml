# Full MVP stack: front (Caddy) -> backend (Go, with agent) -> rag (Python) -> Qdrant + PostgreSQL.
# Start: docker compose --profile local-db up -d --build   (details: docs/docker.md)
name: prawdowid

services:
  postgres:
    # Local database. Skip this profile when DATABASE_URL points to Supabase.
    profiles: ["local-db"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      # Required in local mode: the postgres image refuses to start with an empty password.
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-}
      POSTGRES_DB: rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 2s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  rag:
    build: ./rag
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      RAG_POSTGRES_DSN: ${DATABASE_URL:-postgresql://rag:${RAG_POSTGRES_PASSWORD:-}@postgres:5432/rag}
      RAG_POSTGRES_POOL_MAX_SIZE: ${RAG_POSTGRES_POOL_MAX_SIZE:-5}
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_MODEL_CACHE_DIR: /models
      RAG_ADMIN_TOKEN: ${RAG_ADMIN_TOKEN:-}
      RAG_EXPANSION_LLM_URL: ${RAG_EXPANSION_LLM_URL:-}
      RAG_EXPANSION_LLM_MODEL: ${RAG_EXPANSION_LLM_MODEL:-qwen3.5:9b}
      RAG_EXPANSION_LLM_API_KEY: ${RAG_EXPANSION_LLM_API_KEY:-}
      FACTCHECK_API_KEY: ${FACTCHECK_API_KEY:-}
      EUVSDISINFO_TOKEN: ${EUVSDISINFO_TOKEN:-}
    volumes:
      - model_cache:/models
    healthcheck:
      # The first start downloads ~3 GB of models, hence the long start period.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 600s
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    # Localhost only for debugging; the public entry point is the front service.
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://rag:${RAG_POSTGRES_PASSWORD:-}@postgres:5432/rag}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-5}
      RAG_URL: http://rag:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      rag:
        condition: service_healthy

  front:
    build:
      context: .
      dockerfile: deploy/front.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      BACKEND_URL: http://backend:3001
    depends_on:
      - backend

  eval:
    # Test harness, run on demand: docker compose --profile tools run --rm eval
    profiles: ["tools"]
    build:
      context: ./eval
      dockerfile: ../deploy/eval.Dockerfile
    volumes:
      - ./eval/reports:/srv/reports
    depends_on:
      backend:
        condition: service_healthy

volumes:
  qdrant_data:
  postgres_data:
  model_cache:
